<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Gluten-free, dairy-free recipes matched to what's already in your pantry.">
<meta name="theme-color" content="#F4F2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0E0D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sift">
<title>Sift, gluten free and dairy free recipes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=202609011943">
</head>
<body>

<div class="app">

  <header class="topbar">
    <span class="brand">Sift<em>.</em></span>
    <span class="today" id="todayLabel"></span>
  </header>

  <main class="content">

    <!-- ============ TODAY ============ -->
    <section class="view" id="view-today" aria-labelledby="tab-today">

      <div id="todaySkeleton">
        <div class="skeleton skeleton-hero"></div>
        <div class="section-head"><span class="section-title">Loading recipes</span></div>
        <div class="rail">
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
        </div>
      </div>

      <div id="todayContent" hidden>
        <!-- first run: point straight at the pantry-first flow -->
        <div class="cta-card" id="startCard" hidden>
          <h3>Start with what you already have</h3>
          <p>Tick off the ingredients in your kitchen and Sift shows you only the recipes you can actually cook tonight.</p>
          <button class="btn btn-primary btn-block" type="button" id="startPantryBtn">Choose my ingredients</button>
        </div>

        <button class="hero" id="heroCard" type="button">
          <img id="heroImg" class="hero-img" src="" alt="">
          <span class="hero-text">
            <span class="eyebrow">Recipe of the day</span>
            <h1 id="heroName"></h1>
            <span class="hero-meta" id="heroMeta"></span>
            <span class="hero-match" id="heroMatch" hidden></span>
          </span>
        </button>

        <div class="section-head">
          <h2 class="section-title">Ready to cook</h2>
          <span class="section-meta" id="readyCount"></span>
        </div>
        <div id="readyWrap"></div>

        <div class="section-head">
          <h2 class="section-title">Everything else</h2>
          <span class="section-meta" id="allCount"></span>
        </div>
        <div class="marquee" id="marqueeWrap">
          <div class="marquee-track" id="marqueeTrack"></div>
        </div>
      </div>
    </section>

    <!-- ============ SPIN ============ -->
    <section class="view" id="view-wheel" hidden aria-labelledby="tab-wheel">
      <div class="deck-stage">
        <div class="deck" id="deck"></div>
      </div>
      <div class="meal-row" id="mealRow" role="tablist" aria-label="Meal"></div>
      <div class="spin-actions">
        <button class="btn btn-primary btn-block btn-big" id="spinBtn" type="button">Spin</button>
      </div>
      <label class="switch-row">
        <span class="switch-text">
          <span class="switch-title">Match my pantry</span>
          <span class="switch-sub" id="switchSub">Deal only recipes you already have at least half the ingredients for.</span>
        </span>
        <input type="checkbox" id="pantryOnlyToggle" aria-describedby="switchSub">
      </label>
    </section>

    <!-- ============ BROWSE ============ -->
    <section class="view" id="view-browse" hidden aria-labelledby="tab-browse">
      <div class="chip-row" id="categoryFilters" role="tablist" aria-label="Filter by category"></div>
      <div class="grid" id="browseGrid"></div>
    </section>


    <!-- ============ PLAN ============ -->
    <section class="view" id="view-plan" hidden aria-labelledby="tab-plan">
      <div class="cal-head">
        <button class="cal-nav" id="calPrev" type="button" aria-label="Previous month">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h2 class="cal-title" id="calTitle"></h2>
        <button class="cal-nav" id="calNext" type="button" aria-label="Next month">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div class="cal-dow" id="calDow"></div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="day-panel" id="dayPanel" hidden>
        <div class="day-panel-head">
          <div>
            <span class="day-panel-date" id="dayPanelDate"></span>
            <h3 class="day-panel-name" id="dayPanelName"></h3>
            <span class="day-panel-meta" id="dayPanelMeta"></span>
          </div>
          <img class="day-panel-img" id="dayPanelImg" src="" alt="">
        </div>
        <div class="day-panel-list" id="dayPanelList"></div>
        <div class="day-panel-actions">
          <button class="btn btn-primary" type="button" id="dayShareBtn">Share list</button>
          <button class="btn btn-secondary" type="button" id="dayOpenBtn">Open recipe</button>
          <button class="btn btn-quiet" type="button" id="dayClearBtn">Remove</button>
        </div>
      </div>
    </section>

    <!-- ============ PANTRY ============ -->
    <section class="view" id="view-pantry" hidden aria-labelledby="tab-pantry">
      <div class="pantry-bar">
        <input class="search" id="pantrySearch" type="search" placeholder="Search ingredients" aria-label="Search ingredients">
        <span class="pantry-count" id="pantryCount"></span>
      </div>
      <section class="kit">
        <h2 class="group-title kit-title">
          <span class="label">My kitchen</span>
          <span class="group-count" id="kitCount"></span>
        </h2>
        <div class="kit-row" id="kitRow"></div>
      </section>
      <div id="pantryGroups"></div>
      <p class="empty" id="pantryEmpty" hidden>No ingredient matches that search.</p>
    </section>

  </main>

  <!-- One icon family: 22x22 optical box, 1.6 stroke, 2.2 corner radius.
       Outline = unselected, solid = selected. Metaphors are literal:
       a bowl for today's dish, two dealt cards for spin, a grid of cards
       for browse, a jar for the pantry. -->
  <nav class="tabbar" id="tabbar" aria-label="Main">
    <button class="tab" id="tab-today" type="button" data-view="today" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g class="glyph-line" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M3.4 10.8h17.2a8.6 8.6 0 01-17.2 0z"/>
          <path d="M12 3.4c1.9 1.2 1.9 3 0 4.2"/>
          <path d="M8.4 5c1.2.8 1.2 1.9 0 2.7"/><path d="M15.6 5c1.2.8 1.2 1.9 0 2.7"/>
        </g>
        <g class="glyph-fill" fill="currentColor">
          <path d="M3.4 10.8h17.2a8.6 8.6 0 01-17.2 0z"/>
        </g>
        <g class="glyph-fill" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M12 3.4c1.9 1.2 1.9 3 0 4.2"/>
          <path d="M8.4 5c1.2.8 1.2 1.9 0 2.7"/><path d="M15.6 5c1.2.8 1.2 1.9 0 2.7"/>
        </g>
      </svg>
      <span>Today</span>
    </button>

    <button class="tab" id="tab-wheel" type="button" data-view="wheel">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g class="glyph-line" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
          <rect x="9.4" y="5.2" width="9.4" height="12.6" rx="2.1" transform="rotate(15 14.1 11.5)"/>
          <rect x="5.2" y="6.2" width="9.4" height="12.6" rx="2.1" transform="rotate(-12 9.9 12.5)"/>
        </g>
        <g class="glyph-fill">
          <rect x="9.4" y="5.2" width="9.4" height="12.6" rx="2.1" transform="rotate(15 14.1 11.5)"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <rect x="5.2" y="6.2" width="9.4" height="12.6" rx="2.1" transform="rotate(-12 9.9 12.5)"
                fill="currentColor" stroke="var(--ground)" stroke-width="1.7" stroke-linejoin="round"/>
        </g>
      </svg>
      <span>Spin</span>
    </button>

    <button class="tab" id="tab-browse" type="button" data-view="browse">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g class="glyph-line" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
          <rect x="3.6" y="3.6" width="7.4" height="7.4" rx="2.2"/><rect x="13" y="3.6" width="7.4" height="7.4" rx="2.2"/>
          <rect x="3.6" y="13" width="7.4" height="7.4" rx="2.2"/><rect x="13" y="13" width="7.4" height="7.4" rx="2.2"/>
        </g>
        <!-- filled squares are inset so this glyph carries the same optical
             weight as the single-shape glyphs beside it -->
        <g class="glyph-fill" fill="currentColor">
          <rect x="4.2" y="4.2" width="6.2" height="6.2" rx="1.9"/><rect x="13.6" y="4.2" width="6.2" height="6.2" rx="1.9"/>
          <rect x="4.2" y="13.6" width="6.2" height="6.2" rx="1.9"/><rect x="13.6" y="13.6" width="6.2" height="6.2" rx="1.9"/>
        </g>
      </svg>
      <span>Browse</span>
    </button>

    <button class="tab" id="tab-plan" type="button" data-view="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g class="glyph-line" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
          <rect x="3.6" y="5.2" width="16.8" height="15.2" rx="2.6"/><path d="M3.6 10h16.8M8 3.4v3.4M16 3.4v3.4"/>
        </g>
        <g class="glyph-fill" fill="currentColor">
          <path d="M3.6 10h16.8v7.8a2.6 2.6 0 01-2.6 2.6H6.2a2.6 2.6 0 01-2.6-2.6V10z"/>
          <path d="M6.2 5.2h11.6a2.6 2.6 0 012.6 2.6V10H3.6V7.8a2.6 2.6 0 012.6-2.6z" opacity=".4"/>
          <path d="M8 3.4v3.4M16 3.4v3.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </g>
      </svg>
      <span>Plan</span>
    </button>

    <button class="tab" id="tab-pantry" type="button" data-view="pantry">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g class="glyph-line" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
          <path d="M8.4 3.4h7.2v2.1l1.5 2.4a3 3 0 01.5 1.6v8.9a2.2 2.2 0 01-2.2 2.2H8.6a2.2 2.2 0 01-2.2-2.2V9.5a3 3 0 01.5-1.6l1.5-2.4V3.4z"/>
          <path d="M6.6 12.6h10.8"/>
        </g>
        <g class="glyph-fill" fill="currentColor">
          <path d="M8.4 3.4h7.2v2.1l1.5 2.4a3 3 0 01.5 1.6v8.9a2.2 2.2 0 01-2.2 2.2H8.6a2.2 2.2 0 01-2.2-2.2V9.5a3 3 0 01.5-1.6l1.5-2.4V3.4z" opacity=".3"/>
          <path d="M6.4 12.6h11.2v5.8a2.2 2.2 0 01-2.2 2.2H8.6a2.2 2.2 0 01-2.2-2.2v-5.8z"/>
          <path d="M8.4 3.4h7.2v2.1l1.5 2.4a3 3 0 01.5 1.6v.9H6.4v-.9a3 3 0 01.5-1.6l1.5-2.4V3.4z"/>
        </g>
      </svg>
      <span>Pantry</span>
    </button>
  </nav>

  <!-- live hand-off from the pantry to the recipes it unlocks -->
  <div class="pantry-action" id="pantryAction">
    <button class="btn btn-primary" type="button" id="pantryActionBtn"></button>
  </div>

</div>

<!-- ============ recipe sheet ============ -->
<div class="scrim" id="sheetScrim">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetName" tabindex="-1">
    <div class="sheet-bar" id="sheetBar">
      <span class="sheet-bar-title" id="sheetBarTitle"></span>
    </div>
    <button class="sheet-close" id="closeSheetBtn" type="button" aria-label="Close recipe">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <div class="sheet-scroll" id="sheetScroll">
      <div class="sheet-hero">
        <img id="sheetImg" class="sheet-img" src="" alt="">
      </div>
      <div class="sheet-body">
        <span class="sheet-source" id="sheetSource"></span>
        <span class="sheet-time" id="sheetTime" hidden></span>
        <h2 id="sheetName"></h2>
        <div class="diet-tags" id="sheetTags"></div>
        <p class="sheet-method" id="sheetMethod"></p>
        <p class="recipe-note" id="sheetNote" hidden></p>

        <div class="ing-head">
          <h3>Ingredients</h3>
          <span class="ing-count" id="ingredientsCount"></span>
        </div>
        <ul class="ing-list" id="ingredientList"></ul>

        <div class="plan-card" id="planCard">
          <button class="plan-row" id="planRow" type="button" aria-expanded="false" aria-controls="miniCal">
            <span class="plan-label">Cook this on</span>
            <span class="plan-value" id="planValue">Today</span>
            <svg class="plan-chevron" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </button>

          <div class="mini-cal" id="miniCal" hidden>
            <div class="mini-head">
              <button class="cal-nav" id="miniPrev" type="button" aria-label="Previous month">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
              </button>
              <span class="mini-title" id="miniTitle"></span>
              <button class="cal-nav" id="miniNext" type="button" aria-label="Next month">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
              </button>
            </div>
            <div class="mini-dow" id="miniDow"></div>
            <div class="mini-grid" id="miniGrid"></div>
          </div>
        </div>
        <button class="plan-clear" id="planClear" type="button" hidden>Remove from plan</button>

        <div class="ing-head" id="methodHead" hidden>
          <h3>Method</h3>
          <span class="ing-count" id="stepsCount"></span>
        </div>
        <ol class="step-list" id="stepList"></ol>

        <a class="source-link" id="sheetLink" href="#" target="_blank" rel="noopener">
          Full recipe on <span id="sheetLinkSource"></span> &rarr;
        </a>
      </div>
    </div>
    <div class="sheet-footer">
      <button class="btn btn-primary" id="calendarBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V4"/><path d="M8.4 7.6L12 4l3.6 3.6"/><path d="M5 13.5v4.6a2 2 0 002 2h10a2 2 0 002-2v-4.6"/></svg>
        <span id="calendarBtnLabel">Add to my list</span>
      </button>
    </div>
  </div>
</div>

<div class="visually-hidden" id="liveRegion" role="status" aria-live="polite"></div>

<script src="icons.js?v=202609011943"></script>
<script src="app.js?v=202609011943"></script>
</body>
</html>
